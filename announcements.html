<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Major League — Announcements</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:20px 16px 40px;background:radial-gradient(circle at top,#171717 0,#000 42%)}
.wrap{width:min(680px,100%);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-size:22px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.back{color:#fff;text-decoration:none;border:1px solid #fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;letter-spacing:.08em}
.heading{text-align:center;margin:12px 0 26px}
.heading h1{margin:0 0 8px;font-size:clamp(30px,8vw,46px);text-transform:uppercase;letter-spacing:-.04em}
.heading p{margin:0;color:#aaa;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.feed{display:flex;flex-direction:column;gap:16px}
.post{border:1px solid rgba(255,255,255,.22);border-radius:20px;overflow:hidden;background:#0b0b0b;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.post-body{padding:20px}
.date{color:#888;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
.post h2{margin:0 0 10px;font-size:23px;text-transform:uppercase;letter-spacing:-.02em}
.post p{margin:0;color:#d0d0d0;line-height:1.55;font-size:15px}
.tag{display:inline-block;margin-top:16px;padding:7px 10px;border:1px solid #444;border-radius:999px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">Major League</div><a class="back" href="./">BACK</a></header>
<section class="heading"><h1>Announcements</h1><p>Official updates from Major League</p></section>
<section class="feed">
<article class="post"><div class="post-body">
<div class="date">First Announcement</div>
<h2>Welcome to the Elite</h2>
<p>Welcome to the Major League announcement feed. All official announcements, updates and important information will be posted here.</p>
<span class="tag">Major League</span>
</div></article>
</section>
</main>
</body>
</html>
