<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Major League — Announcements</title>
<style>
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh}
.page{width:100%;max-width:760px;margin:0 auto;padding-bottom:60px}
.welcome{position:relative;width:100%;background:#000}
.welcome img{display:block;width:100%;height:auto;margin:0}
.back-hit{position:absolute;top:2.2%;right:7%;width:19%;height:4.5%;z-index:5;display:block;-webkit-tap-highlight-color:transparent}
.feed{padding:30px 18px 0}
.feed-heading{margin:0 0 22px;font-size:26px;letter-spacing:4px;font-weight:800}
.announcement{margin:0 0 22px;padding:24px;box-sizing:border-box;border:1px solid #444;border-radius:24px;background:#090909}
.announcement h2{margin:0 0 14px;font-size:28px;line-height:1.15}
.message{margin:0 0 20px;color:#ddd;font-size:18px;line-height:1.55;white-space:pre-wrap}
.announcement img{display:block;width:100%;height:auto;border-radius:16px;margin:0 0 20px}
.link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;box-sizing:border-box;border:2px solid #fff;border-radius:999px;color:#fff;text-decoration:none;font-size:14px;font-weight:800;letter-spacing:1.5px}
.empty,.error{color:#888;text-align:center;padding:30px 10px}
</style>
</head>
<body>
<main class="page">
<section class="welcome">
<img src="elite-smokers-club-welcome.jpeg" alt="Welcome to The Elite Smokers Club" draggable="false">
<a class="back-hit" href="./" aria-label="Back to Major League"></a>
</section>
<section class="feed">
<h1 class="feed-heading">LATEST ANNOUNCEMENTS</h1>
<div id="feed"></div>
</section>
</main>
<script>
async function loadAnnouncements(){
const feed=document.getElementById("feed");
try{
const response=await fetch("announcements.json?v="+Date.now(),{cache:"no-store"});
if(!response.ok)throw new Error("Could not load announcements");
const announcements=await response.json();
if(!Array.isArray(announcements)||announcements.length===0){
feed.innerHTML='<div class="empty">No announcements yet.</div>';return;
}
feed.innerHTML=announcements.map(item=>{
const title=escapeHtml(item.title||"");
const message=escapeHtml(item.message||"");
const photo=item.photo||"";
const link=item.link||"";
const photoHtml=photo?'<img src="'+escapeAttr(photo)+'" alt="" loading="lazy">':"";
const linkHtml=link?'<a class="link" href="'+escapeAttr(link)+'" target="_blank" rel="noopener">OPEN LINK</a>':"";
return '<article class="announcement"><h2>'+title+'</h2><p class="message">'+message+'</p>'+photoHtml+linkHtml+'</article>';
}).join("");
}catch(error){
feed.innerHTML='<div class="error">Unable to load announcements.</div>';
console.error(error);
}}
function escapeHtml(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escapeAttr(value){return escapeHtml(value)}
loadAnnouncements();
</script>
</body>
</html>
