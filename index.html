<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="manifest" href="manifest.webmanifest">

  <title>Major League</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    OneSignalDeferred.push(async function(OneSignal) {

      const notifyBtn = document.getElementById("notifyBtn");
      const websiteBtn = document.getElementById("websiteBtn");

      try {

        await OneSignal.init({
          appId: "879ccb0b-e136-4e8d-a833-d89b897ca2d4"
        });

        notifyBtn.disabled = false;

        async function checkSubscription() {
          try {
            if (OneSignal.User.PushSubscription.optedIn) {
              websiteBtn.style.display = "block";
            }
          } catch (error) {
            console.error(error);
          }
        }

        notifyBtn.addEventListener("click", async function() {

          try {
            await OneSignal.Notifications.requestPermission();
          } catch (error) {
            console.error(error);
          }

          setTimeout(checkSubscription, 1000);

        });

        checkSubscription();

      } catch (error) {
        console.error("OneSignal initialization error:", error);
      }

    });

    function openWebsite() {
      window.location.href = "https://justpaste.it/elqpy";
    }
  </script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 710px;
      margin: 0 auto;
    }

    .page-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* Invisible button over ENABLE NOTIFICATIONS */

    #notifyBtn {
      position: absolute;

      left: 14.8%;
      top: 45.8%;

      width: 70.5%;
      height: 6%;

      padding: 0;
      margin: 0;

      border: 0;
      border-radius: 999px;

      background: transparent;
      opacity: 0;

      cursor: pointer;
      z-index: 10;

      -webkit-tap-highlight-color: transparent;
    }

    #notifyBtn:disabled {
      cursor: default;
    }

    /* Website button shown after subscription */

    #websiteBtn {
      display: none;

      position: absolute;

      left: 14.8%;
      top: 53.5%;

      width: 70.5%;
      height: 6%;

      border: 2px solid #fff;
      border-radius: 999px;

      background: #000;
      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;

      z-index: 20;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

  </style>

</head>

<body>

  <main class="page">

    <img
      class="page-image"
      src="major-league-webpage.jpeg"
      alt="Major League"
      draggable="false"
    >

    <button
      id="notifyBtn"
      type="button"
      aria-label="Enable Notifications"
      disabled>
    </button>

    <button
      id="websiteBtn"
      type="button"
      onclick="openWebsite()">
      VISIT WEBSITE
    </button>

  </main>

</body>
</html>
