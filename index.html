<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="manifest" href="manifest.webmanifest">

  <title>Major League</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    OneSignalDeferred.push(async function(OneSignal) {

      const notifyBtn = document.getElementById("notifyBtn");
      const websiteBtn = document.getElementById("websiteBtn");
      const menuBtn = document.getElementById("menuBtn");
      const menuPanel = document.getElementById("menuPanel");

      try {

        await OneSignal.init({
          appId: "879ccb0b-e136-4e8d-a833-d89b897ca2d4"
        });

        notifyBtn.disabled = false;

        async function checkSubscription() {
          try {
            if (OneSignal.User.PushSubscription.optedIn) {
              websiteBtn.style.display = "block";
            }
          } catch (error) {
            console.error(error);
          }
        }

        notifyBtn.addEventListener("click", async function() {

          try {
            await OneSignal.Notifications.requestPermission();
          } catch (error) {
            console.error(error);
          }

          setTimeout(checkSubscription, 1000);

        });

        checkSubscription();

      } catch (error) {
        console.error("OneSignal initialization error:", error);
      }

      menuBtn.addEventListener("click", function() {
        menuPanel.classList.toggle("open");
      });

    });

    function openWebsite() {
      window.location.href = "https://justpaste.it/elqpy";
    }
  </script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .page-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Invisible clickable area over the MENU
      already contained inside the artwork.
    */

    #menuBtn {
      position: absolute;

      right: 5.5%;
      top: 4%;

      width: 24%;
      height: 6.5%;

      padding: 0;
      margin: 0;

      border: 0;
      background: transparent;

      opacity: 0;

      z-index: 20;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    /*
      Invisible clickable area over
      ENABLE NOTIFICATIONS.
    */

    #notifyBtn {
      position: absolute;

      left: 13.5%;
      top: 43.8%;

      width: 73%;
      height: 6.5%;

      padding: 0;
      margin: 0;

      border: 0;
      border-radius: 999px;

      background: transparent;

      opacity: 0;

      cursor: pointer;
      z-index: 20;

      -webkit-tap-highlight-color: transparent;
    }

    #notifyBtn:disabled {
      cursor: default;
    }

    /*
      Invisible clickable area over
      VISIT WEBSITE.
    */

    #websiteBtn {
      display: none;

      position: absolute;

      left: 13.5%;
      top: 49.3%;

      width: 73%;
      height: 6.5%;

      padding: 0;
      margin: 0;

      border: 0;
      border-radius: 999px;

      background: transparent;

      opacity: 0;

      z-index: 20;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    /*
      ANNOUNCEMENTS DROPDOWN
    */

    #menuPanel {
      display: none;

      position: absolute;

      right: 5.5%;
      top: 11%;

      width: 52%;
      max-width: 280px;

      box-sizing: border-box;

      padding: 10px;

      background: rgba(0, 0, 0, 0.96);

      border: 1px solid #fff;
      border-radius: 18px;

      z-index: 30;
    }

    #menuPanel.open {
      display: block;
    }

    #menuPanel a {
      display: block;

      padding: 16px 14px;

      color: #fff;

      text-decoration: none;

      font-family: Arial, sans-serif;

      font-size: 16px;

      font-weight: 800;

      letter-spacing: 1.5px;
    }

  </style>

</head>

<body>

  <main class="page">

    <!-- Full-screen Major League artwork -->

    <img
      class="page-image"
      src="major-league-webpage-fullscreen.png"
      alt="Major League"
      draggable="false"
    >

    <!-- Invisible MENU click area -->

    <button
      id="menuBtn"
      type="button"
      aria-label="Open menu">
    </button>

    <!-- Invisible notification click area -->

    <button
      id="notifyBtn"
      type="button"
      aria-label="Enable Notifications"
      disabled>
    </button>

    <!-- Invisible website click area -->

    <button
      id="websiteBtn"
      type="button"
      aria-label="Visit Website"
      onclick="openWebsite()">
    </button>

    <!-- Dropdown menu -->

    <nav
      id="menuPanel"
      aria-label="Main menu">

      <a href="announcements.html">
        ANNOUNCEMENTS
      </a>

    </nav>

  </main>

</body>
</html>
